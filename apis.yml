name: qingflow
description: >-
  Qingflow (轻流) is an AI-powered no-code and low-code business management platform
  that lets enterprises build digital operations systems — forms, workflows and
  approval processes, portals, reports, data management, and automation — without
  writing code. Its Open Platform exposes OpenAPI interfaces, an outbound Webhook
  connector, single sign-on / account integration, and no-code connectors (Q-Linker,
  Q-Source) for pushing and collecting data across systems such as DingTalk, WeChat
  Work, and Feishu. Qingflow also ships AI features (QingClaw assistant, QingBuilder
  one-sentence app generation) and prebuilt ERP/CRM/OA/project-management solution
  templates. The company is backed by Qiming Venture Partners.
